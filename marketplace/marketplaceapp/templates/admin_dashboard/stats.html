{% extends "admin_dashboard/base.html" %}

{% block page_title %}
<i class="fas fa-chart-bar mr-2"></i> Statistiques du Tableau de Bord
{% endblock %}

{% block content %}

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <section class="lg:col-span-2 space-y-8">
        
        <!-- 📊 Cartes statistiques PLUS GRANDES -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8" id="stats-cards">
        </div>

    </section>
    
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const colorMap = {
    blue: ['bg-blue-100','text-blue-500'],
    purple: ['bg-purple-100','text-purple-500'],
    red: ['bg-red-100','text-red-500'],
    yellow: ['bg-yellow-100','text-yellow-500'],
    teal: ['bg-teal-100','text-teal-500'],
    orange: ['bg-orange-100','text-orange-500'],
    pink: ['bg-pink-100','text-pink-500'],
    green: ['bg-green-100','text-green-500']
};

function createCard(title, value, icon, color){
    const [bg, text] = colorMap[color] || colorMap.blue;
    const el = document.createElement('div');
    el.className = `
        card bg-white shadow-lg rounded-2xl 
        p-8 min-h-[160px] w-full
        hover:shadow-2xl transition duration-300
    `;
    el.innerHTML = `
        <div class="flex items-center justify-between h-full">
            <div>
                <p class="text-gray-500 text-base">${title}</p>
                <h2 class="text-4xl font-bold text-gray-800 mt-2">${value}</h2>
            </div>
            <div class="p-6 rounded-full ${bg} ${text}">
                <i class="fas ${icon} text-4xl"></i>
            </div>
        </div>
    `;
    return el;
}

let activityChart = null;
let metricsChart = null;

function loadStats(range='7d'){
    fetch('/api/stats/dashboard/?range='+range)
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('stats-cards');
            container.innerHTML = '';

            const cards = [
                { title: "Utilisateurs", value: data.users.total, icon: "fa-users", color: "blue" },
                { title: "Artisans", value: data.artisans.total, icon: "fa-user-tie", color: "purple" },
                { title: "Artisans vérifiés", value: data.artisans.verified, icon: "fa-check-circle", color: "green" },
                { title: "KYC en attente", value: data.kyc.pending, icon: "fa-hourglass-half", color: "red" },
                { title: "Posts", value: data.posts.total, icon: "fa-image", color: "yellow" },
                { title: "Messages", value: data.messages.total_messages, icon: "fa-envelope", color: "teal" },
                { title: "Messages non lus", value: data.messages.unread_messages, icon: "fa-envelope-open-text", color: "orange" },
                { title: "Signalements", value: data.reports.pending, icon: "fa-flag", color: "pink" }
            ];

            cards.forEach(c =>
                container.appendChild(createCard(c.title, c.value, c.icon, c.color))
            );
        });
}

document.addEventListener('DOMContentLoaded', () => loadStats('7d'));
</script>

{% endblock %}
